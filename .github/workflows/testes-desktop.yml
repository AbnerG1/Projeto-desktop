name: Testes do Desktop

on:
  push:
    branches:
      - main
      - refactor/oo-venda-validacoes-testes
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: Gestao de Caixa
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verificar sintaxe
        run: python -m py_compile sistema_bd.py gestao_de_caixa.py
      - name: Executar testes automatizados
        run: python -m unittest discover -s tests -v
